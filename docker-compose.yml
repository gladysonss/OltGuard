services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oltguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oltguard}
      POSTGRES_DB: ${POSTGRES_DB:-oltguard}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oltguard} -d ${POSTGRES_DB:-oltguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oltguard}:${POSTGRES_PASSWORD:-oltguard}@postgres:5432/${POSTGRES_DB:-oltguard}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY precisa ser definida (64 caracteres hex)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET precisa ser definida}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
